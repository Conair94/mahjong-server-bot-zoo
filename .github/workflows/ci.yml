# CI matrix per docs/specs/determinism.md § Cross-platform stability:
#   Linux and macOS, supported Python 3.12 and 3.13.
#   A divergence on any cell is a release blocker.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev deps
        run: python -m pip install -c requirements-dev.txt -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy (strict on engine + table)
        run: mypy mahjong/

      - name: Pytest (unit, integration, and platform checks)
        # conftest skips Linux-only tests on macOS. Any failure fails the job.
        run: python -m pytest --ignore=tests/web

      - name: Build and verify distribution
        run: |
          python -m build
          python scripts/check_distribution.py dist/*.whl

  browser:
    name: Chromium / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install -c requirements-dev.txt -e ".[dev,web]"
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest tests/web
