# Pre-commit hooks implementing the verification ladder (CLAUDE.md):
#   1. Formatter (ruff format)
#   2. Linter / static analysis (ruff check)
#   3. Type-check (mypy)
#   4. Unit tests for the rules engine (pytest; fast subset only)
#
# Heavier checks (cross-platform determinism, integration tests, Botzone
# judge-acceptance) run in CI, not pre-commit, to keep the local loop fast.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        entry: python -m mypy mahjong/
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (fast unit tests only)
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        args: ["-x", "tests/engine", "tests/records", "tests/lint", "-m", "not integration and not linux_only and not slow"]
